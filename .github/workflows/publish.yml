name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (must match project version)"
        required: false

jobs:
  publish-github-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Read JDK version from catalog
        id: versions
        run: |
          JDK=$(grep -E '^jdk\s*=' gradle/libs.versions.toml | head -1 | sed 's/.*=\s*"\([^"]*\)"/\1/')
          echo "jdk=$JDK" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.jdk }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish to GitHub Packages
        run: ./gradlew :kmp-proto:publishAllPublicationsToGitHubPackagesRepository :kmp-proto-gradle-plugin:publishPlugins || ./gradlew :kmp-proto:publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-maven-central:
    runs-on: ubuntu-latest
    needs: publish-github-packages
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Read JDK version from catalog
        id: versions
        run: |
          JDK=$(grep -E '^jdk\s*=' gradle/libs.versions.toml | head -1 | sed 's/.*=\s*"\([^"]*\)"/\1/')
          echo "jdk=$JDK" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.jdk }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Publish to Maven Central
        run: |
          echo "Configure OSSRH / Maven Central credentials via secrets before enabling."
          echo "Expected coordinates: io.github.vishalsharma7nov:kmp-proto"
          # ./gradlew :kmp-proto:publishToMavenCentral
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
